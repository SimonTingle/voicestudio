name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose actual preview153 MSI as standard user
        shell: powershell
        run: ./scripts/diagnose-msi-policy.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: msi-policy-diagnostics
          path: C:/Users/Public/vs-msi-policy/
          retention-days: 3
